[project]
name = "graybox"
version = "0.1.0"
description = "Gray Box - Remember Better."
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "litellm==1.93.0",
    "tenacity==9.1.2",
    "python-dotenv==1.2.2",
    "readchar==4.2.2",
    "pyfiglet==1.0.3",
]

[project.scripts]
graybox = "graybox.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["graybox", "graybox.ai"]

[tool.coverage.run]
omit = [
    "graybox/cli.py",
    "graybox/dashboard.py",
]